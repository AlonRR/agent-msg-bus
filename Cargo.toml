[package]
name = "agent-msg-bus"
version = "0.1.0"
edition = "2021"

[dependencies]
# bundled: compiles SQLite in, so the deployed artefact stays a single binary with
# no libsqlite3 dependency on the target CT.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
