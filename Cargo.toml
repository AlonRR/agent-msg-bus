[package]
name = "agent-msg-bus"
version = "0.1.0"
edition = "2021"

[dependencies]
# bundled: compiles SQLite in, so the deployed artefact stays a single binary with
# no libsqlite3 dependency on the target CT.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
# blocking HTTP for the CLI half. Deliberately not reqwest: the client path needs no
# async runtime, and ureq keeps the single binary small.
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tokio-tungstenite = "0.24"
